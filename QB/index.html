<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heart Disease Risk Check</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 24px; color: #222; }
    .card { max-width: 640px; margin: auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h1 { font-size: 22px; margin-top: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
    input, select { padding: 7px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    button { margin-top: 16px; width: 100%; padding: 10px; background: #c0392b; color: #fff; border: none; border-radius: 5px; font-size: 15px; cursor: pointer; }
    #result { margin-top: 18px; padding: 14px; border-radius: 6px; display: none; }
    .low { background: #e8f6ec; border-left: 5px solid #27ae60; }
    .moderate { background: #fff6e0; border-left: 5px solid #f39c12; }
    .high { background: #fdecea; border-left: 5px solid #c0392b; }
    .error { background: #eee; border-left: 5px solid #555; }
    .note { font-size: 12px; color: #777; margin-top: 14px; }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="card">
  <h1>Heart Disease Risk Check</h1>
  <form id="form">
    <div class="grid">
      <label>Age <input name="age" type="number" value="55"></label>
      <label>Sex
        <select name="sex"><option value="1">Male</option><option value="0">Female</option></select></label>
      <label>Chest pain type
        <select name="cp">
          <option value="1">1 - Typical angina</option><option value="2">2 - Atypical angina</option>
          <option value="3">3 - Non-anginal pain</option><option value="4">4 - No symptoms</option>
        </select></label>
      <label>Resting blood pressure (mm Hg) <input name="trestbps" type="number" value="130"></label>
      <label>Cholesterol (mg/dl) <input name="chol" type="number" value="240"></label>
      <label>Fasting blood sugar &gt; 120
        <select name="fbs"><option value="0">No</option><option value="1">Yes</option></select></label>
      <label>Resting ECG
        <select name="restecg"><option value="0">0 - Normal</option><option value="1">1 - ST-T abnormality</option><option value="2">2 - LV hypertrophy</option></select></label>
      <label>Max heart rate <input name="thalach" type="number" value="150"></label>
      <label>Exercise-induced angina
        <select name="exang"><option value="0">No</option><option value="1">Yes</option></select></label>
      <label>ST depression (oldpeak) <input name="oldpeak" type="number" step="0.1" value="1.0"></label>
      <label>ST slope
        <select name="slope"><option value="1">1 - Upsloping</option><option value="2">2 - Flat</option><option value="3">3 - Downsloping</option></select></label>
      <label>Major vessels (0-3) <input name="ca" type="number" value="0"></label>
      <label>Thalassemia
        <select name="thal"><option value="3">3 - Normal</option><option value="6">6 - Fixed defect</option><option value="7">7 - Reversible defect</option></select></label>
    </div>
    <button type="submit">Check my risk</button>
  </form>
  <div id="result"></div>
  <p class="note">This is a student project for learning purposes, not a medical diagnosis.</p>
</div>

<script>
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = {};
    new FormData(e.target).forEach((v, k) => data[k] = Number(v));
    const box = document.getElementById("result");
    box.style.display = "block";
    try {
      const res = await fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      });
      const out = await res.json();
      if (!res.ok) {
        box.className = "error";
        box.innerHTML = "<b>Please check your input.</b><br>" + JSON.stringify(out.detail);
        return;
      }
      box.className = out.risk_level.split(" ")[0].toLowerCase();
      box.innerHTML = `<b>${out.risk_level}</b> (${Math.round(out.risk_probability * 100)}%)<br>${out.message}`;
    } catch (err) {
      box.className = "error";
      box.textContent = "Could not reach the server. Is it running?";
    }
  });
</script>
</body>
</html>
